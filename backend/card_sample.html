<script>
function initProductSliders() {
  document.querySelectorAll('.product-media-wrapper').forEach(wrapper => {

    // Prevent double initialization
    if (wrapper.classList.contains('slider-initialized')) return;
    wrapper.classList.add('slider-initialized');

    const slideshow = wrapper.querySelector('.product-image-slideshow');
    const images   = slideshow?.querySelectorAll('img') || [];
    const dots     = wrapper.querySelectorAll('.product-dots .dot');

    // If only 1 image → just show it
    if (images.length <= 1) {
      if (images.length === 1) images[0].style.opacity = '1';
      return;
    }

    let currentIndex = 0;
    let touchStartX  = 0;
    let autoInterval = null;

    function showSlide(idx) {
      currentIndex = (idx + images.length) % images.length;

      images.forEach((img, i) => {
        img.style.opacity = (i === currentIndex) ? '1' : '0';
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function next() { showSlide(currentIndex + 1); }
    function prev() { showSlide(currentIndex - 1); }

    // Desktop hover autoplay
    wrapper.addEventListener('mouseenter', () => {
      if (autoInterval) clearInterval(autoInterval);
      autoInterval = setInterval(next, 2200);
    });

    wrapper.addEventListener('mouseleave', () => {
      if (autoInterval) {
        clearInterval(autoInterval);
        autoInterval = null;
      }
      showSlide(0);
    });

    // Mobile swipe
    wrapper.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    wrapper.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;

      if (Math.abs(diff) > 50) {
        diff > 0 ? next() : prev();
      }
    }, { passive: true });

    // Dot click
    dots.forEach((dot, idx) => {
      dot.addEventListener('click', () => {
        showSlide(idx);
        if (autoInterval) {
          clearInterval(autoInterval);
          autoInterval = null;
        }
      });
    });

    // Init first slide
    showSlide(0);
  });
}

document.addEventListener('DOMContentLoaded', initProductSliders);

const observer = new MutationObserver(() => {
  initProductSliders();
});

observer.observe(document.body, {
  childList: true,
  subtree: true
});
</script>
